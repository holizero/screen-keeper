name: Windows 빌드와 검사
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [anycpu, x86]
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 빌드와 자동 검사
        shell: pwsh
        run: ./test.ps1 -Platform ${{ matrix.platform }}
      - name: 공개 배포 자료 만들기
        if: matrix.platform == 'anycpu'
        shell: pwsh
        run: ./package.ps1
      - name: 배포 자료 보관
        if: matrix.platform == 'anycpu'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screen-keeper-windows
          path: dist/v1.0.0/*
          if-no-files-found: error
